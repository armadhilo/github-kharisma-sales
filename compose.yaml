services:
  # ============================================================================
  # Application Service (PHP-FPM)
  # ============================================================================
  app:
    build:
      context: .
      target: app
    image: kharisma-sales-app:latest
    container_name: kharisma-sales-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_NAME: ${APP_NAME:-Laravel}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost}
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
      LOG_LEVEL: ${LOG_LEVEL:-error}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-kharisma_sales}
      DB_USERNAME: ${DB_USERNAME:-sales_user}
      DB_PASSWORD: ${DB_PASSWORD}
      BROADCAST_DRIVER: ${BROADCAST_DRIVER:-log}
      CACHE_DRIVER: ${CACHE_DRIVER:-file}
      FILESYSTEM_DRIVER: ${FILESYSTEM_DRIVER:-local}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-sync}
      SESSION_DRIVER: ${SESSION_DRIVER:-file}
      SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
      ODOO_URL: ${ODOO_URL}
      ODOO_DB: ${ODOO_DB}
      ODOO_USERNAME: ${ODOO_USERNAME}
      ODOO_PASSWORD: ${ODOO_PASSWORD}
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/99-custom.ini:ro
      - storage_uploads:/var/www/html/storage/app/public
      - storage_logs:/var/www/html/storage/logs
      - storage_framework:/var/www/html/storage/framework
    networks:
      - kharisma-internal
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M

  # ============================================================================
  # Web Server Service (Nginx)
  # ============================================================================
  web:
    build:
      context: .
      target: web
    image: kharisma-sales-web:latest
    container_name: kharisma-sales-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - storage_uploads:/var/www/html/storage/app/public:ro
    networks:
      - kharisma-internal
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/robots.txt || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M

  # ============================================================================
  # Database Service (MySQL 8.0)
  # Isolated to internal network - NO public port exposure
  # ============================================================================
  mysql:
    image: mysql:8.0
    container_name: kharisma-sales-mysql
    restart: unless-stopped
    ports:
       - "127.0.0.1:3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-kharisma_sales}
      MYSQL_USER: ${DB_USERNAME:-sales_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-${DB_PASSWORD}}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
    networks:
      - kharisma-internal
    # Ports are intentionally omitted to avoid public exposure to host network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER:-root} -p$${MYSQL_PASSWORD:-$${MYSQL_ROOT_PASSWORD}} || mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

  # ============================================================================
  # Optional: Queue Worker Service (Profile: worker)
  # Run with: docker compose --profile worker up -d
  # ============================================================================
  worker:
    image: kharisma-sales-app:latest
    container_name: kharisma-sales-worker
    restart: unless-stopped
    profiles: ["worker"]
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=90"]
    env_file:
      - .env
    environment:
      APP_NAME: ${APP_NAME:-Laravel}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-kharisma_sales}
      DB_USERNAME: ${DB_USERNAME:-sales_user}
      DB_PASSWORD: ${DB_PASSWORD}
      CACHE_DRIVER: ${CACHE_DRIVER:-file}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      ODOO_URL: ${ODOO_URL}
      ODOO_DB: ${ODOO_DB}
      ODOO_USERNAME: ${ODOO_USERNAME}
      ODOO_PASSWORD: ${ODOO_PASSWORD}
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/99-custom.ini:ro
      - storage_uploads:/var/www/html/storage/app/public
      - storage_logs:/var/www/html/storage/logs
      - storage_framework:/var/www/html/storage/framework
    networks:
      - kharisma-internal
    depends_on:
      mysql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  # ============================================================================
  # Optional: Scheduler Service (Profile: scheduler)
  # Run with: docker compose --profile scheduler up -d
  # ============================================================================
  scheduler:
    image: kharisma-sales-app:latest
    container_name: kharisma-sales-scheduler
    restart: unless-stopped
    profiles: ["scheduler"]
    command: ["sh", "-c", "while true; do php artisan schedule:run --verbose --no-interaction & sleep 60; done"]
    env_file:
      - .env
    environment:
      APP_NAME: ${APP_NAME:-Laravel}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-kharisma_sales}
      DB_USERNAME: ${DB_USERNAME:-sales_user}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/99-custom.ini:ro
      - storage_uploads:/var/www/html/storage/app/public
      - storage_logs:/var/www/html/storage/logs
      - storage_framework:/var/www/html/storage/framework
    networks:
      - kharisma-internal
    depends_on:
      mysql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M

  caddy:
    image: caddy:2
    container_name: kharisma-sales-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - kharisma-internal
    depends_on:
      - web

# ==============================================================================
# Persistent Storage Volumes
# ==============================================================================
volumes:
  caddy_data:
    name: kharisma_sales_caddy_data
  caddy_config:
    name: kharisma_sales_caddy_config
  mysql_data:
    name: kharisma_sales_mysql_data
  storage_uploads:
    name: kharisma_sales_storage_uploads
  storage_logs:
    name: kharisma_sales_storage_logs
  storage_framework:
    name: kharisma_sales_storage_framework

# ==============================================================================
# Internal Network
# ==============================================================================
networks:
  kharisma-internal:
    driver: bridge
    name: kharisma-internal
